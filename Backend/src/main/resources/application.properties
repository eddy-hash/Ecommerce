pring.application.name=ecommerce-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=ChangeMeToA32ByteLongRandomStringForHS256Key!!
app.jwt.expiration-ms=86400000

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=INFO


# File uploads
app.upload.dir=C:/Ecommerce/uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
